let i=0, answered=false;
function render(){
  const q=questions[i]; answered=false;
  document.getElementById('next').disabled=true;
  document.getElementById('pos').textContent='Question '+(i+1)+' of '+questions.length+' — '+q.category;
  let html='<div class="meta">'+q.category+'</div>';
  html+='<h3>'+q.question+'</h3>';
  q.options.forEach(function(opt,idx){ html+='<label class="opt" id="opt'+idx+'"><input type="radio" name="a" onchange="reveal('+idx+')"> '+String.fromCharCode(65+idx)+'. '+opt+'</label>'; });
  html+='<div class="exp" id="exp"><b>Answer: '+String.fromCharCode(65+q.correct)+'.</b> '+q.explanation+'</div>';
  document.getElementById('card').innerHTML=html;
  document.getElementById('prev').disabled = (i===0);
}
function reveal(idx){
  answered=true;
  const q=questions[i];
  document.querySelectorAll('.opt').forEach(function(el,k){
    el.classList.remove('correct','wrong');
    if(k===q.correct) el.classList.add('correct');
    if(k===idx && idx!==q.correct) el.classList.add('wrong');
  });
  document.getElementById('exp').style.display='block';
  document.getElementById('next').disabled=false;
}
function nav(dir){
  i+=dir; if(i<0)i=0; if(i>=questions.length)i=questions.length-1;
  render(); window.scrollTo(0,0);
}
