    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let userAnswers = [];

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&';
            if (m === '<') return '<';
            if (m === '>') return '>';
            return m;
        });
    }

    function renderQuestion() {
        const container = document.getElementById('questionsRoot');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');

        answered = false;
        nextBtn.disabled = true;

        const qa = qaData[currentQuestionIndex];
        const letters = ['A', 'B', 'C', 'D'];

        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${qaData.length}`;
        scoreText.textContent = `Score: ${score}`;
        progressFill.style.width = `${((currentQuestionIndex) / qaData.length) * 100}%`;

        const optionsHtml = qa.opts.map((opt, i) => `
            <li class="option-item" data-answer="${letters[i]}">
                <span class="option-letter">${letters[i]}</span>
                <span class="option-text">${escapeHtml(opt)}</span>
            </li>
        `).join('');

        container.innerHTML = `
            <div class="question-block">
                <div class="q-meta">Q${currentQuestionIndex + 1}</div>
                <div class="question-text">${escapeHtml(qa.q)}</div>
                <ul class="options-list">${optionsHtml}</ul>
                <div id="answerBox" style="display:none;">
                    <div class="answer-result" id="answerResult"></div>
                    <div class="explanation-box">
                        <div class="explanation-title">📖 EXPLANATION</div>
                        <div class="explanation-text">${escapeHtml(qa.justification)}</div>
                    </div>
                </div>
            </div>
        `;

        document.querySelectorAll('.option-item').forEach(option => {
            option.addEventListener('click', function() {
                selectAnswer(this);
            });
        });
    }

    function selectAnswer(selectedOption) {
        if (answered) return;

        answered = true;

        const selectedAnswer = selectedOption.getAttribute('data-answer');
        const qa = qaData[currentQuestionIndex];
        const correctAnswer = qa.correct;

        const answerBox = document.getElementById('answerBox');
        const answerResult = document.getElementById('answerResult');
        const nextBtn = document.getElementById('nextBtn');

        userAnswers.push({
            question: qa.q,
            selected: selectedAnswer,
            correct: correctAnswer,
            isCorrect: selectedAnswer === correctAnswer
        });

        if (selectedAnswer === correctAnswer) {
            score++;
            selectedOption.classList.add('selected-correct');
            answerResult.className = 'answer-result correct';
            answerResult.innerHTML = `✓ Correct! Answer is: ${correctAnswer}`;
        } else {
            selectedOption.classList.add('selected-wrong');
            answerResult.className = 'answer-result wrong';
            answerResult.innerHTML = `✗ Wrong. Correct Answer is: ${correctAnswer}`;
            
            document.querySelectorAll('.option-item').forEach(option => {
                if (option.getAttribute('data-answer') === correctAnswer) {
                    option.classList.add('correct-answer');
                }
            });
        }

        document.getElementById('scoreText').textContent = `Score: ${score}`;
        answerBox.style.display = 'block';
        nextBtn.disabled = false;

        if (currentQuestionIndex === qaData.length - 1) {
            nextBtn.textContent = 'Finish Quiz';
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < qaData.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        const container = document.getElementById('questionsRoot');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        const percentage = Math.round((score / qaData.length) * 100);

        progressText.textContent = 'Quiz Completed';
        scoreText.textContent = `Final Score: ${score}/${qaData.length}`;
        progressFill.style.width = '100%';

        let resultMessage = '';

        if (percentage >= 90) {
            resultMessage = 'Excellent risk assessment knowledge!';
        } else if (percentage >= 75) {
            resultMessage = 'Good result. Review the incorrect answers.';
        } else if (percentage >= 60) {
            resultMessage = 'Fair result. More revision is recommended.';
        } else {
            resultMessage = 'Needs improvement. Please review the full question set again.';
        }

        container.innerHTML = `
            <div class="final-result">
                <h2>🎉 Quiz Completed</h2>
                <div class="final-score">${score} / ${qaData.length}</div>
                <p><strong>Percentage:</strong> ${percentage}%</p>
                <p>${resultMessage}</p>
            </div>
        `;

        nextBtn.style.display = 'none';
        restartBtn.style.display = 'inline-block';
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        answered = false;
        userAnswers = [];

        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').textContent = 'Next Question';
        document.getElementById('restartBtn').style.display = 'none';

        renderQuestion();
    }

    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('restartBtn').addEventListener('click', restartQuiz);
        renderQuestion();
    });
</script>
</body></html>
